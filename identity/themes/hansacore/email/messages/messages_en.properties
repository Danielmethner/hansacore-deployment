emailVerificationSubject=Verify your HansaCore email address
emailVerificationBody=Someone created a HansaCore account with this email address. If this was you, open the link below to verify your email address.\n\n{0}\n\nThis link expires within {3}.\n\nIf you did not create this account, ignore this message.
emailVerificationBodyHtml=<p>Someone created a HansaCore account with this email address. If this was you, click the button below to verify your email address.</p><p><a href="{0}" style="display:inline-block;padding:10px 20px;background:#012c64;color:#ffffff;text-decoration:none;border-radius:4px;">Verify email address</a></p><p>This link expires within {3}.</p><p>If you did not create this account, ignore this message.</p>
passwordResetSubject=Reset your HansaCore password
passwordResetBody=Someone asked to reset the password of your HansaCore account. If this was you, open the link below to choose a new password.\n\n{0}\n\nThis link expires within {3}.\n\nIf you did not ask for this, ignore this message. Your password stays unchanged.
passwordResetBodyHtml=<p>Someone asked to reset the password of your HansaCore account. If this was you, click the button below to choose a new password.</p><p><a href="{0}" style="display:inline-block;padding:10px 20px;background:#012c64;color:#ffffff;text-decoration:none;border-radius:4px;">Reset password</a></p><p>This link expires within {3}.</p><p>If you did not ask for this, ignore this message. Your password stays unchanged.</p>
identityProviderLinkSubject=Link your HansaCore account
identityProviderLinkBody=Someone wants to link your HansaCore account "{1}" with the {0} account of user {2}. If this was you, open the link below to link the accounts.\n\n{3}\n\nThis link expires within {5}.\n\nIf you do not want to link the accounts, ignore this message.
identityProviderLinkBodyHtml=<p>Someone wants to link your HansaCore account <b>{1}</b> with the <b>{0}</b> account of user {2}. If this was you, click the button below to link the accounts.</p><p><a href="{3}" style="display:inline-block;padding:10px 20px;background:#012c64;color:#ffffff;text-decoration:none;border-radius:4px;">Link accounts</a></p><p>This link expires within {5}.</p><p>If you do not want to link the accounts, ignore this message.</p>
