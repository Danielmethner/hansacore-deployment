# Traefik quirk: an Ingress annotated with `router.tls: "true"` (see
# 06/07-ingress-*.yaml) only ever registers a router on the TLS entrypoint —
# it does NOT also create a matching plain-HTTP router that could be
# redirected. Without this separate, TLS-less Ingress bound only to the
# `web` (port 80) entrypoint, plain HTTP requests just 404 instead of being
# redirected to HTTPS. No `spec.tls` here on purpose, and no host restriction
# needed — it matches any Host on port 80 and immediately redirects before
# ever reaching a backend, so it works unchanged across every overlay.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hansacore-ingress-http-redirect
  namespace: hansacore
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: hansacore-redirect-https@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hansacore-web
                port:
                  number: 80
