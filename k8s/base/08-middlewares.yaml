# Traefik Middlewares (k3s bundles the Traefik CRDs by default).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: hansacore
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# HTTP Basic Auth in front of the Keycloak admin console, as defense-in-depth
# on top of Keycloak's own login. Credentials come from the
# `admin-basicauth-secret` Secret (generated per-overlay from an htpasswd
# file — see k8s/overlays/<env>/secrets/admin-basicauth.env.example).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-basic-auth
  namespace: hansacore
spec:
  basicAuth:
    secret: admin-basicauth-secret
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: hansacore
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    forceSTSHeader: true
    contentTypeNosniff: true
    browserXssFilter: true
    frameDeny: true
