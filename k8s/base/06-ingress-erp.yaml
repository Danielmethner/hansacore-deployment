# ERP host (<env>.erp.hansacore.com): the hansacore-web SPA plus the gateway
# BFF endpoints it talks to. host / tls.hosts are overridden per overlay (see
# overlays/*/kustomization.yaml `patches`) — the placeholders are never used.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hansacore-ingress-erp
  namespace: hansacore
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Force HTTP -> HTTPS, add HSTS/security headers on every route below.
    traefik.ingress.kubernetes.io/router.middlewares: hansacore-redirect-https@kubernetescrd,hansacore-security-headers@kubernetescrd
spec:
  tls:
    - hosts:
        - "CHANGE-ME.invalid"
      secretName: hansacore-tls
  rules:
    - host: "CHANGE-ME.invalid"
      http:
        paths:
          # Gateway BFF Endpoints (Auth Flow & Token Relay).
          # Only the OAuth2 callback under /login belongs to the gateway —
          # /login itself is an SPA route and must fall through to hansacore-web.
          - path: /login/oauth2
            pathType: Prefix
            backend:
              service:
                name: portal-gateway
                port:
                  number: 8080
          # Prefix, not Exact: Traefik ranks routers by rule length, and
          # Path(`/logout`) ties with the SPA's PathPrefix(`/`) and loses.
          - path: /logout
            pathType: Prefix
            backend:
              service:
                name: portal-gateway
                port:
                  number: 8080
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: portal-gateway
                port:
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: portal-gateway
                port:
                  number: 8080
          - path: /be
            pathType: Prefix
            backend:
              service:
                name: portal-gateway
                port:
                  number: 8080

          # Frontend SPA (Fallback Root)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hansacore-web
                port:
                  number: 80
