# NOTE: KEYCLOAK_ISSUER_URI / CORS_ALLOWED_ORIGINS come from the `hansacore-env`
# ConfigMap (generated per-overlay) so this base manifest never hardcodes a
# specific VM IP/hostname. Same manifest works unchanged for local-vm and gcp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hansacore-api
  namespace: hansacore
  labels:
    app: hansacore-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hansacore-api
  template:
    metadata:
      labels:
        app: hansacore-api
    spec:
      containers:
        - name: hansacore-api
          image: hansacore-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: hansacore-env
          # SPRING_PROFILES_ACTIVE and the DEV CA truststore are set per overlay.
          env:
            - name: PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres.hansacore.svc.cluster.local:5432/hansacore?currentSchema=hansacore"
            - name: SPRING_DATASOURCE_USERNAME
              value: "hansacore_api"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: HANSACORE_API_PASSWORD
            # CORS_ALLOWED_ORIGINS comes from hansacore-env (envFrom above) and
            # binds to `cors.allowed.origins` by relaxed binding. The issuer is
            # bound by its canonical Spring property name, since OS env outranks
            # every application*.properties, whatever a profile file sets.
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: hansacore-env
                  key: KEYCLOAK_ISSUER_URI
            # JAVA_TOOL_OPTIONS is left to the overlays (DEV truststore).
            - name: JDK_JAVA_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+UseZGC"
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8081
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: hansacore-api
  namespace: hansacore
spec:
  selector:
    app: hansacore-api
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  type: ClusterIP
