# NOTE: KEYCLOAK_ISSUER_URI comes from the `hansacore-env` ConfigMap
# (generated per-overlay); KEYCLOAK_CLIENT_SECRET comes from the
# `keycloak-clients-secret` Secret (generated per-overlay). This base
# manifest never hardcodes a specific VM IP/hostname or secret value.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-gateway
  namespace: hansacore
  labels:
    app: portal-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal-gateway
  template:
    metadata:
      labels:
        app: portal-gateway
    spec:
      containers:
        - name: portal-gateway
          image: portal-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: hansacore-env
          env:
            - name: KEYCLOAK_CLIENT_ID
              value: "portal-gateway"
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-clients-secret
                  key: PORTAL_GATEWAY_CLIENT_SECRET
            - name: HANSACORE_API_URL
              value: "http://hansacore-api.hansacore.svc.cluster.local:8081"
            - name: HANSACORE_WEB_URL
              value: "http://hansacore-web.hansacore.svc.cluster.local:80"
            # KEYCLOAK_ISSUER_URI comes from hansacore-env (envFrom above).
            # Login/logout redirects are relative to the request host, so
            # one gateway serves both the ERP and the portal host.
            # JAVA_TOOL_OPTIONS is left to the overlays (DEV truststore).
            - name: JDK_JAVA_OPTIONS
              value: "-Xms128m -Xmx256m"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: portal-gateway
  namespace: hansacore
spec:
  selector:
    app: portal-gateway
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
