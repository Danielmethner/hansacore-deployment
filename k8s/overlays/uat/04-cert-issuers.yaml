# HTTP-01 through the k3s Traefik ingress. No DNS API token in the cluster.
# The catch-all HTTP redirect Ingress matches PathPrefix `/` with no Host.
# cert-manager's solver Ingress is Host + `/.well-known/acme-challenge/`,
# which Traefik ranks higher, so the challenge is not redirected.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: danielmethnerek@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: danielmethnerek@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
