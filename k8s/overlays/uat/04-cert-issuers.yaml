# The ACME zone lives in the shared project (hansacore); the VM's service
# account (project hansacore-uat) may edit only that zone. See infra/modules/environment.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: danielmethnerek@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cnameStrategy: Follow
          cloudDNS:
            project: hansacore
            hostedZoneName: hansacore-uat-acme-zone
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: danielmethnerek@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cnameStrategy: Follow
          cloudDNS:
            project: hansacore
            hostedZoneName: hansacore-uat-acme-zone
