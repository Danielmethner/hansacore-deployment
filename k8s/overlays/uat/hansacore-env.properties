# Non-secret configuration for UAT (GCP, project hansacore-uat). The
# Ingress/TLS host patches in kustomization.yaml, the Certificate in
# 05-certificate.yaml and the hostnames in infra/envs/uat/main.tf must match.
ERP_HOSTNAME=uat.erp.hansacore.com
PORTAL_HOSTNAME=uat.hansacore.com
AUTH_HOSTNAME=uat.auth.hansacore.com
KEYCLOAK_ISSUER_URI=https://uat.auth.hansacore.com/realms/portal
CORS_ALLOWED_ORIGINS=https://uat.erp.hansacore.com,https://uat.hansacore.com
KC_HOSTNAME=uat.auth.hansacore.com
KC_PROXY_HEADERS=xforwarded
# Seed the demo tenants/users and sample content; only read on a fresh DB.
HANSACORE_DEMODATA_ENABLED=true
