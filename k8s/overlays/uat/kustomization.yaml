apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hansacore

resources:
  - ../../base
  - 04-cert-issuers.yaml
  - 05-certificate.yaml
  # Generated by scripts/render-realm.sh uat — git-ignored.
  - 02a-keycloak-realm-cm.generated.yaml

components:
  - ../../components/demo-data
  # Postgres hostPath on the data disk, admin Ingress without BasicAuth.
  - ../../components/gcp-vm

configMapGenerator:
  - name: hansacore-env
    envs:
      - hansacore-env.properties

secretGenerator:
  - name: postgres-secret
    envs:
      - secrets/postgres.env
    options:
      disableNameSuffixHash: true
  - name: keycloak-admin-secret
    envs:
      - secrets/keycloak-admin.env
    options:
      disableNameSuffixHash: true
  - name: keycloak-clients-secret
    envs:
      - secrets/keycloak-clients.env
    options:
      disableNameSuffixHash: true
  - name: admin-basicauth-secret
    files:
      - users=secrets/admin-basicauth.htpasswd
    options:
      disableNameSuffixHash: true

# UAT hostnames — must match hansacore-env.properties and infra/envs/uat.
patches:
  - target:
      kind: Ingress
      name: hansacore-ingress-erp
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: uat.erp.hansacore.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: uat.erp.hansacore.com
  - target:
      kind: Ingress
      name: hansacore-ingress-portal
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: uat.hansacore.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: uat.hansacore.com
  - target:
      kind: Ingress
      name: hansacore-ingress-(auth|admin)
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: uat.auth.hansacore.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: uat.auth.hansacore.com
  # Only here, not in the shared hansacore-env ConfigMap: the gateway reads
  # that too and must not run the API's profile.
  - target:
      kind: Deployment
      name: hansacore-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_PROFILES_ACTIVE
          value: "uat"
