apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hansacore

resources:
  - ../../base
  # Generated by scripts/render-realm.sh gcp — git-ignored.
  - 02a-keycloak-realm-cm.generated.yaml

components:
  - ../../components/demo-data

configMapGenerator:
  - name: hansacore-env
    envs:
      - hansacore-env.properties

secretGenerator:
  - name: postgres-secret
    envs:
      - secrets/postgres.env
    options:
      disableNameSuffixHash: true
  - name: keycloak-admin-secret
    envs:
      - secrets/keycloak-admin.env
    options:
      disableNameSuffixHash: true
  - name: keycloak-clients-secret
    envs:
      - secrets/keycloak-clients.env
    options:
      disableNameSuffixHash: true
  - name: admin-basicauth-secret
    files:
      - users=secrets/admin-basicauth.htpasswd
    options:
      disableNameSuffixHash: true

# SIT hostnames — must match hansacore-env.properties.
patches:
  - target:
      kind: Ingress
      name: hansacore-ingress-erp
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: sit.erp.hansacore.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: sit.erp.hansacore.com
  - target:
      kind: Ingress
      name: hansacore-ingress-portal
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: sit.hansacore.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: sit.hansacore.com
  - target:
      kind: Ingress
      name: hansacore-ingress-(auth|admin)
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: sit.auth.hansacore.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: sit.auth.hansacore.com
  # Only here, not in the shared hansacore-env ConfigMap: the gateway reads
  # that too and must not run the API's profile.
  - target:
      kind: Deployment
      name: hansacore-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_PROFILES_ACTIVE
          value: "sit"
  - target:
      kind: Deployment
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: postgres-storage
          hostPath:
            path: /mnt/disks/postgres-data
            type: DirectoryOrCreate
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgres-pvc
        namespace: hansacore
      $patch: delete