apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hansacore

resources:
  - ../../base
  # Generated by scripts/render-realm.sh gcp — git-ignored.
  - 02a-keycloak-realm-cm.generated.yaml

configMapGenerator:
  - name: hansacore-env
    envs:
      - hansacore-env.properties

secretGenerator:
  - name: postgres-secret
    envs:
      - secrets/postgres.env
    options:
      disableNameSuffixHash: true
  - name: keycloak-admin-secret
    envs:
      - secrets/keycloak-admin.env
    options:
      disableNameSuffixHash: true
  - name: keycloak-clients-secret
    envs:
      - secrets/keycloak-clients.env
    options:
      disableNameSuffixHash: true
  - name: admin-basicauth-secret
    files:
      - users=secrets/admin-basicauth.htpasswd
    options:
      disableNameSuffixHash: true

# TODO before first GCP apply: replace CHANGE-ME below (and in
# hansacore-env.properties) with the real hostname.
patches:
  - target:
      kind: Ingress
      name: hansacore-ingress
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: CHANGE-ME.example.com
  - target:
      kind: Ingress
      name: hansacore-ingress-admin
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: CHANGE-ME.example.com
