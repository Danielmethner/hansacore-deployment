# Fill this in once the GCP VM/DNS record exists — this is the ONLY file
# that should need to change for the GCP lift, mirroring overlays/local-vm.
# Prefer a real DNS name pointed at the VM's static external IP over a raw
# IP, so future re-IPs (or moving to a managed LB) don't require touching
# manifests again.
PUBLIC_HOSTNAME=CHANGE-ME.example.com
KEYCLOAK_ISSUER_URI=https://CHANGE-ME.example.com/realms/portal
CORS_ALLOWED_ORIGINS=https://CHANGE-ME.example.com
FRONTEND_URL=https://CHANGE-ME.example.com
KC_HOSTNAME=CHANGE-ME.example.com
KC_PROXY_HEADERS=xforwarded
