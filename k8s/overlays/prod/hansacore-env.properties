# Non-secret configuration for prod (Hetzner, hansacore-prod). The Ingress/TLS
# host patches in kustomization.yaml, the Certificate in 05-certificate.yaml,
# and the DNS names in infra/envs/prod must match.
ERP_HOSTNAME=erp.hansacore.com
PORTAL_HOSTNAME=hansacore.com
AUTH_HOSTNAME=auth.hansacore.com
KEYCLOAK_ISSUER_URI=https://auth.hansacore.com/realms/portal
CORS_ALLOWED_ORIGINS=https://erp.hansacore.com,https://hansacore.com
KC_HOSTNAME=auth.hansacore.com
KC_PROXY_HEADERS=xforwarded
# Demo data disabled for production.
HANSACORE_DEMODATA_ENABLED=false

