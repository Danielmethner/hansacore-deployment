apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hansacore

resources:
  - ../../base
  - 04-cert-issuers.yaml
  - 05-certificate.yaml
  # Generated by scripts/render-realm.sh prod — git-ignored.
  - 02a-keycloak-realm-cm.generated.yaml

components:
  # Admin Ingress without BasicAuth. Postgres stays on local-path.
  - ../../components/hetzner-vm

configMapGenerator:
  - name: hansacore-env
    envs:
      - hansacore-env.properties

secretGenerator:
  - name: postgres-secret
    envs:
      - secrets/postgres.env
    options:
      disableNameSuffixHash: true
  - name: keycloak-admin-secret
    envs:
      - secrets/keycloak-admin.env
    options:
      disableNameSuffixHash: true
  - name: keycloak-clients-secret
    envs:
      - secrets/keycloak-clients.env
    options:
      disableNameSuffixHash: true
  - name: admin-basicauth-secret
    files:
      - users=secrets/admin-basicauth.htpasswd
    options:
      disableNameSuffixHash: true

# Prod hostnames — must match hansacore-env.properties and infra/envs/prod.
patches:
  - target:
      kind: Ingress
      name: hansacore-ingress-erp
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: erp.hansacore.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: erp.hansacore.com
  - target:
      kind: Ingress
      name: hansacore-ingress-portal
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: hansacore.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: hansacore.com
  - target:
      kind: Ingress
      name: hansacore-ingress-(auth|admin)
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: auth.hansacore.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: auth.hansacore.com
  # Only here, not in the shared hansacore-env ConfigMap: the gateway reads
  # that too and must not run the API's profile.
  - target:
      kind: Deployment
      name: hansacore-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_PROFILES_ACTIVE
          value: "prod"
  # 8 GB CPX32. shared_buffers is real RAM (1GB); effective_cache_size is a planner hint.
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - -c
          - shared_buffers=1GB
          - -c
          - effective_cache_size=4GB
          - -c
          - random_page_cost=1.1
          - -c
          - wal_sync_method=fdatasync
          - -c
          - work_mem=16MB
