# Non-secret configuration for the first GCP environment (SIT). This is the
# ONLY file that should need to change for the GCP lift, mirroring
# overlays/local-vm. The Ingress/TLS host patches in kustomization.yaml must
# match. All three names need public DNS records pointing at the VM's static
# external IP.
ERP_HOSTNAME=sit.erp.hansacore.com
PORTAL_HOSTNAME=sit.hansacore.com
AUTH_HOSTNAME=sit.auth.hansacore.com
KEYCLOAK_ISSUER_URI=https://sit.auth.hansacore.com/realms/portal
CORS_ALLOWED_ORIGINS=https://sit.erp.hansacore.com,https://sit.hansacore.com
KC_HOSTNAME=sit.auth.hansacore.com
KC_PROXY_HEADERS=xforwarded
# Seed the demo tenants/users and sample content; only read on a fresh DB.
HANSACORE_DEMODATA_ENABLED=true
