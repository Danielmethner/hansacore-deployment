# Non-secret, environment-specific configuration for the local Multipass/k3s
# VM (DEV). This is the ONLY file you should need to touch when the hostnames
# change — the Deployments, the realm import and the render/cert scripts all
# read from here. The Ingress/TLS host patches in kustomization.yaml must match.
#
# Hostname layout: <env>.<app>.hansacore.com, prod has no env label.
# These names are not in public DNS: the Windows host resolves them via the
# hosts file (vm/update-hosts.ps1), pods via CoreDNS (vm/coredns-custom.yaml).
ERP_HOSTNAME=dev.erp.hansacore.com
PORTAL_HOSTNAME=dev.hansacore.com
AUTH_HOSTNAME=dev.auth.hansacore.com
KEYCLOAK_ISSUER_URI=https://dev.auth.hansacore.com/realms/portal
CORS_ALLOWED_ORIGINS=https://dev.erp.hansacore.com,https://dev.hansacore.com,http://localhost:4200
KC_HOSTNAME=dev.auth.hansacore.com
KC_PROXY_HEADERS=xforwarded
