# Non-secret, environment-specific configuration for the local Multipass/k3s
# VM. This is the ONLY file you should need to touch when the VM's hostname
# changes — everything else (Deployments, the realm import, TLS SANs) reads
# from this single source via envFrom/render scripts.
#
# k3s-lab.mshome.net is registered automatically by Hyper-V/Multipass for the
# "k3s-lab" VM and stays stable across VM restarts (unlike the DHCP-assigned
# IP) — prefer browsing to https://k3s-lab.mshome.net over the raw IP.
PUBLIC_HOSTNAME=k3s-lab.mshome.net
KEYCLOAK_ISSUER_URI=https://k3s-lab.mshome.net/realms/portal
CORS_ALLOWED_ORIGINS=https://k3s-lab.mshome.net,http://localhost:4200
FRONTEND_URL=https://k3s-lab.mshome.net
KC_HOSTNAME=k3s-lab.mshome.net
KC_PROXY_HEADERS=xforwarded
