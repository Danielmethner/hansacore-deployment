apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hansacore

resources:
  - ../../base
  # Generated by scripts/render-realm.sh local-vm — git-ignored, contains
  # rendered secret values. Run that script before `kubectl apply -k .`.
  - 02a-keycloak-realm-cm.generated.yaml

components:
  - ../../components/demo-data

configMapGenerator:
  - name: hansacore-env
    envs:
      - hansacore-env.properties

secretGenerator:
  - name: postgres-secret
    envs:
      - secrets/postgres.env
    options:
      disableNameSuffixHash: true
  - name: keycloak-admin-secret
    envs:
      - secrets/keycloak-admin.env
    options:
      disableNameSuffixHash: true
  - name: keycloak-clients-secret
    envs:
      - secrets/keycloak-clients.env
    options:
      disableNameSuffixHash: true
  - name: admin-basicauth-secret
    files:
      - users=secrets/admin-basicauth.htpasswd
    options:
      disableNameSuffixHash: true

# The Ingress objects in base ship with placeholder hosts — patch in this
# environment's real ones (must match hansacore-env.properties) so the base
# manifests never hardcode a hostname.
patches:
  - target:
      kind: Ingress
      name: hansacore-ingress-erp
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.erp.hansacore.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev.erp.hansacore.com
  - target:
      kind: Ingress
      name: hansacore-ingress-portal
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.hansacore.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev.hansacore.com
  - target:
      kind: Ingress
      name: hansacore-ingress-(auth|admin)
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.auth.hansacore.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev.auth.hansacore.com

  # Only here, not in the shared hansacore-env ConfigMap: the gateway reads
  # that too and must not run the API's profile.
  - target:
      kind: Deployment
      name: hansacore-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_PROFILES_ACTIVE
          value: "dev"

  # The self-signed DEV CA is trusted only in this overlay; SIT uses public
  # certificates and the JVM's default truststore.
  - path: dev-ca-trust.patch.yaml
